# Managed by ngx-workshop CLI. Policy v1; edit the central CLI profile, then run workflows --apply.
name: "Validate service-bff-ngx-workshop"
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: "read"
jobs:
  validate:
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: "22.23.5"
          cache: "npm"
      - run: "npm ci"
      - run: "npm run format:check"
      - run: "npm run lint:check"
      - run: "npm test -- --runInBand"
      - run: "npm run test:e2e -- --runInBand"
      - run: "npm run build"
      - run: "npm run test:maintenance"
