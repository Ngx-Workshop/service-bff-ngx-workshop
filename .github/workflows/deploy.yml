# Managed by ngx-workshop CLI. Policy v1; edit the central CLI profile, then run workflows --apply.
name: "Verify, deploy and manually publish service-bff-ngx-workshop"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      operation:
        description: "Manual operation (main only); pushes verify and deploy automatically"
        type: "choice"
        required: true
        default: "verify"
        options:
          - "verify"
          - "deploy"
permissions:
  contents: "read"
jobs:
  validate:
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: "22.23.5"
          cache: "npm"
      - run: "npm ci"
      - run: "npm run format:check"
      - run: "npm run lint:check"
      - run: "npm test -- --runInBand"
      - run: "npm run test:e2e -- --runInBand"
      - run: "npm run build"
      - run: "npm run test:maintenance"
  deploy:
    needs: "validate"
    if: "github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))"
    permissions:
      contents: "read"
    concurrency:
      group: "service-bff-ngx-workshop-production"
      cancel-in-progress: false
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      - name: "Verify deployment cleanup policy"
        run: "PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_cleanup_deployment.py"
      - name: "Prepare source and private runtime configuration"
        env:
          PORT: "${{ secrets.PORT }}"
          AUTH_BASE_URL: "${{ secrets.AUTH_BASE_URL }}"
          MFE_ORCHESTRATOR_URL: "${{ secrets.MFE_ORCHESTRATOR_URL }}"
          SSH_HOST_FINGERPRINT: "${{ secrets.SSH_HOST_FINGERPRINT }}"
        run: |
          set -euo pipefail
          umask 077

          python3 - <<'PY'
          import os
          from pathlib import Path

          names = ("PORT", "AUTH_BASE_URL", "MFE_ORCHESTRATOR_URL")
          for name in (*names, "SSH_HOST_FINGERPRINT"):
              value = os.environ.get(name, "")
              if not value or any(c in value for c in ("\r", "\n", "\0")):
                  raise SystemExit(f"Missing or invalid {name}")

          if os.environ["PORT"] != "3002":
              raise SystemExit("PORT must be 3002 for this deployment")

          path = Path(".env.next")
          path.write_text(
              "".join(f"{name}={os.environ[name]}\n" for name in names)
          )
          path.chmod(0o600)
          PY

          git archive --format=tar --output=deploy-source.tar HEAD
      - name: "Copy source and runtime configuration"
        uses: "appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345"
        with:
          version: "1.8.0"
          host: "${{ secrets.DROPLET_IP }}"
          username: "root"
          key: "${{ secrets.SSH_PRIVATE_KEY }}"
          fingerprint: "${{ secrets.SSH_HOST_FINGERPRINT }}"
          source: "deploy-source.tar,.env.next"
          target: "/opt/ngx-nestjs-services/ngx-workshop-bff"
          overwrite: true
      - name: "Build and recreate service"
        uses: "appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2"
        with:
          version: "1.8.2"
          host: "${{ secrets.DROPLET_IP }}"
          username: "root"
          key: "${{ secrets.SSH_PRIVATE_KEY }}"
          fingerprint: "${{ secrets.SSH_HOST_FINGERPRINT }}"
          command_timeout: "20m"
          script: |
            set -eu
            umask 077
            cd /opt/ngx-nestjs-services/ngx-workshop-bff
            trap 'rm -f .env.next deploy-source.tar' EXIT

            chmod 600 .env.next
            tar -xf deploy-source.tar
            rm -f deploy-source.tar
            test -f .dockerignore

            docker network inspect ngx-net >/dev/null 2>&1 || {
              docker network create ngx-net ||
                docker network inspect ngx-net >/dev/null
            }

            docker network connect ngx-net ngx-mfe-orchestrator 2>/dev/null || true
            docker network connect ngx-net ngx-auth-service 2>/dev/null || true

            docker build -t ngx-workshop-bff .

            if docker container inspect ngx-workshop-bff >/dev/null 2>&1; then
              previous_image=$(docker inspect --format '{{.Image}}' ngx-workshop-bff)
              docker image tag "$previous_image" ngx-workshop-bff:previous
            fi
            if [ -f .env ]; then
              install -m 600 .env .env.previous
            fi
            install -m 600 .env.next .env
            rm -f .env.next

            if docker container inspect ngx-workshop-bff >/dev/null 2>&1; then
              docker stop ngx-workshop-bff
              docker rm ngx-workshop-bff
            fi

            docker run -d \
              --name ngx-workshop-bff \
              --env-file .env \
              --network ngx-net \
              --restart unless-stopped --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
              -p 3002:3002 \
              ngx-workshop-bff

            attempt=0
            until docker exec ngx-workshop-bff node -e '
              const net = require("node:net");
              const socket = net.connect(3002, "127.0.0.1");
              socket.setTimeout(2000);
              socket.on("connect", () => {
                socket.end();
                process.exit(0);
              });
              socket.on("error", () => process.exit(1));
              socket.on("timeout", () => process.exit(1));
            ' >/dev/null 2>&1; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 30 ]; then
                echo "Service failed its startup check" >&2
                exit 1
              fi
              sleep 2
            done

            # Readiness passed: retire rollback resources for this service only.
            python3 scripts/cleanup-deployment.py ngx-workshop-bff ngx-workshop-bff
      - name: "Remove temporary deployment files"
        if: "always()"
        run: "rm -f .env.next deploy-source.tar"
    env:
      HUSKY: "0"
